[package]
name = "universal-appimage-installer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "uai"

[[bin]]
name = "uai"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
dirs = "5"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
